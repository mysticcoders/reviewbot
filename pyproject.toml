[project]
name = "reviewbot"
version = "0.1.0"
description = "Terminal UI for reviewing GitHub pull requests with your configured agents in Herdr"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Andrew Lombardi", email = "andrew@mysticcoders.com" }]
dependencies = [
    "click>=8.1",
    "textual>=0.80",
    "rich>=13",
]

[project.scripts]
reviewbot = "reviewbot.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewbot"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
