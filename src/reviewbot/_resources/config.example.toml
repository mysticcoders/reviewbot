# ReviewBot configuration. GitHub is the source of truth; a terminal
# multiplexer (Herdr or Rex) hosts the agents.

# Which repositories to watch for review requests and your own open PRs.
#   ["*"]                       every repository you can access
#   ["acme"]                    every repository owned by an org or user
#   ["acme/api", "acme/web"]    only these repositories
#   ["acme", "someone/tool"]    mix owners and individual repositories
# Any command accepts `--watch OWNER[/REPO]` (repeatable) or `--all` to override this.
watch = @WATCH@

# Where ReviewBot keeps cached clones and per-PR worktrees.
work_dir = "~/reviewbot-workspaces"

# Prompt sent to every agent that does not set its own `prompt`. Relative
# paths resolve against this file's directory. See README for placeholders.
# `reviewbot init` also writes walkthrough, tests, security, challenge, and
# verdict templates into prompts/ for per-agent prompts and combat reviews.
prompt = "prompts/review.md"

# Which terminal multiplexer hosts the review agents: "herdr" or "rex".
# With Rex, every agent also needs a `command`: the program to run in its tab.
multiplexer = "@MULTIPLEXER@"

# Herdr only, optional: force new tabs into a particular Herdr workspace ID.
# When omitted, Herdr uses the currently focused workspace.
# herdr_workspace = "workspace-id"

# Rex only, optional: open review tabs in this Rex session (ID or label).
# When omitted, ReviewBot uses the Rex session it runs in ($REX_SESSION).
# rex_session = "reviews"

# Review agents. Each one becomes a TUI shortcut and an `--agent` name.
@AGENTS@

# Optional: launch several agents on the same PR with one key.
# [[groups]]
# name = "pair"
# agents = ["claude", "codex"]
# key = "b"

# Optional: combat review. Agents review the PR, then answer each other's
# reviews. Needs at least two agents. Every setting below is required except
# key, opener, and judge (an opener or judge needs its prompt).
#   style = "parallel"  everyone reviews at once, then each round every agent
#                       answers the others' latest reviews
#   style = "handoff"   agents take turns; each sees every review before it
# [[combats]]
# name = "duel"
# key = "d"
# agents = ["claude", "codex"]
# style = "handoff"
# rounds = 2
# challenge_prompt = "prompts/challenge.md"
# opener = "claude"                       # walkthrough pass before the combat
# opener_prompt = "prompts/walkthrough.md"
# judge = "codex"                         # merges everything into a verdict
# judge_prompt = "prompts/verdict.md"

# Optional: save every finished review as Markdown (with metadata) plus an
# append-only index.jsonl. Without this table, reviews are not saved.
# [output]
# dir = "~/reviewbot-reviews"

# Optional: reuse existing local clones instead of cloning into work_dir.
# ReviewBot only adds detached worktrees and fetches PR refs; it never
# touches the clone's checked-out branch.
# [[checkouts]]
# repo = "acme/api"
# path = "~/code/api"
