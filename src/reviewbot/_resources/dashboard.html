<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReviewBot</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9;
  --panel: #ffffff;
  --text: #1c2128;
  --muted: #5d6673;
  --line: #dde1e6;
  --accent: #2f6fdb;
  --ok: #1f7a46;
  --warn: #9a6400;
  --bad: #b42335;
  --chip: #eef1f5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216;
    --panel: #171b21;
    --text: #e4e8ee;
    --muted: #949daa;
    --line: #2a3039;
    --accent: #7aa7ff;
    --ok: #5cc98a;
    --warn: #e0b04f;
    --bad: #ff7b8a;
    --chip: #222831;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
header {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px 16px;
  padding: 20px 16px 8px;
  max-width: 1100px;
  margin: 0 auto;
}
h1 { font-size: 20px; margin: 0; }
.meta { color: var(--muted); flex: 1; }
button {
  font: inherit;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 4px 12px;
  cursor: pointer;
}
button:disabled { opacity: 0.6; cursor: default; }
main { max-width: 1100px; margin: 0 auto; padding: 0 16px 32px; }
section {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  margin-top: 16px;
  overflow: hidden;
}
section h2 {
  font-size: 15px;
  margin: 0;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 8px;
  align-items: baseline;
}
section h2 .count { color: var(--muted); font-weight: normal; }
.error { color: var(--bad); padding: 10px 14px; border-bottom: 1px solid var(--line); }
.empty { color: var(--muted); padding: 14px; }
ul { list-style: none; margin: 0; padding: 0; }
li {
  display: grid;
  grid-template-columns: 9.5em 1fr auto;
  gap: 4px 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  align-items: baseline;
}
li:last-child { border-bottom: 0; }
li a.title { color: var(--accent); text-decoration: none; font-weight: 600; }
li a.title:hover { text-decoration: underline; }
.key { color: var(--muted); font-variant-numeric: tabular-nums; }
.detail { grid-column: 2 / 4; color: var(--muted); }
.status {
  justify-self: start;
  font-size: 12px;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--chip);
  white-space: nowrap;
}
.status.good { color: var(--ok); }
.status.warn { color: var(--warn); }
.status.bad { color: var(--bad); }
.checks { font-size: 12px; white-space: nowrap; }
.checks.failing { color: var(--bad); }
.checks.passing { color: var(--ok); }
.checks.pending { color: var(--warn); }
button.mark { font-size: 12px; padding: 1px 8px; white-space: nowrap; }
@media (max-width: 640px) {
  li { grid-template-columns: 1fr auto; }
  .detail { grid-column: 1 / 3; }
  .main-line { grid-column: 1 / 3; order: 3; }
}
</style>
</head>
<body>
<header>
  <h1>ReviewBot</h1>
  <span class="meta" id="meta">Loading...</span>
  <button id="refresh" type="button">Refresh from GitHub</button>
</header>
<main>
  <section>
    <h2>Unread notifications <span class="count" id="notes-count"></span></h2>
    <div id="notes"></div>
  </section>
  <section>
    <h2>Waiting on my review <span class="count" id="queue-count"></span></h2>
    <div id="queue"></div>
  </section>
  <section>
    <h2>My open PRs <span class="count" id="mine-count"></span></h2>
    <div id="mine"></div>
  </section>
</main>
<script>
const POLL_MS = 60000;
const GOOD = new Set(["ready", "updated", "approved"]);
const WARN = new Set(["in-progress", "waiting", "re-review", "needs-reviewers", "draft", "reviewed"]);
const BAD = new Set(["changes-requested", "checks-failing", "conflicts"]);

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attrs || {})) {
    if (value != null) node.setAttribute(name, value);
  }
  for (const child of children) {
    if (child != null) node.append(child);
  }
  return node;
}

function statusChip(status) {
  const tone = GOOD.has(status) ? "good" : BAD.has(status) ? "bad" : WARN.has(status) ? "warn" : "";
  return el("span", { class: `status ${tone}` }, status);
}

function row(item, detail) {
  return el("li", {},
    statusChip(item.status),
    el("span", { class: "main-line" },
      el("a", { class: "title", href: item.url, target: "_blank", rel: "noopener noreferrer" }, item.title),
      " ",
      el("span", { class: "key" }, item.key),
    ),
    el("span", { class: `checks ${item.checks}` }, `checks ${item.checks}`),
    el("span", { class: "detail" }, detail),
  );
}

function noteRow(item) {
  const mark = el("button", { class: "mark", type: "button" }, "Mark read");
  mark.addEventListener("click", () => markRead(item.id, mark));
  const link = el("a", { class: "title", href: item.url, target: "_blank", rel: "noopener noreferrer" }, item.title);
  link.addEventListener("click", () => markRead(item.id, mark));
  return el("li", {},
    el("span", { class: "status warn" }, item.reason.replaceAll("_", " ")),
    el("span", { class: "main-line" }, link, " ", el("span", { class: "key" }, item.key)),
    mark,
    el("span", { class: "detail" }, `${item.kind === "pr" ? "pull request" : "issue"} · updated ${ago(item.updated_at)}`),
  );
}

function renderNotes(items, error) {
  const box = document.getElementById("notes");
  box.replaceChildren();
  document.getElementById("notes-count").textContent = items.length ? `${items.length}` : "";
  if (error) box.append(el("div", { class: "error" }, `Query failed: ${error}`));
  if (!items.length && !error) {
    box.append(el("div", { class: "empty" }, "Nothing unread."));
    return;
  }
  box.append(el("ul", {}, ...items.map(noteRow)));
}

async function markRead(id, button) {
  button.disabled = true;
  try {
    const response = await fetch("/api/notifications/read", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id }),
    });
    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      document.getElementById("meta").textContent = `Could not mark read: ${data.error || response.status}`;
      button.disabled = false;
      return;
    }
    load(false);
  } catch (error) {
    document.getElementById("meta").textContent = `Could not reach ReviewBot: ${error}`;
    button.disabled = false;
  }
}

function ago(iso) {
  if (!iso) return "";
  const minutes = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (minutes < 60) return `${minutes}m ago`;
  if (minutes < 1440) return `${Math.round(minutes / 60)}h ago`;
  return `${Math.round(minutes / 1440)}d ago`;
}

function render(target, countTarget, items, error, detail) {
  const box = document.getElementById(target);
  box.replaceChildren();
  document.getElementById(countTarget).textContent = items.length ? `${items.length}` : "";
  if (error) box.append(el("div", { class: "error" }, `Query failed: ${error}`));
  if (!items.length && !error) {
    box.append(el("div", { class: "empty" }, "Nothing here."));
    return;
  }
  box.append(el("ul", {}, ...items.map(item => row(item, detail(item)))));
}

function queueDetail(item) {
  const parts = [`@${item.author}`, `${item.request_source} request`, `updated ${ago(item.updated_at)}`];
  if (item.last_review_state) {
    parts.push(`you ${item.last_review_state.toLowerCase().replace("_", " ")}, ${item.commits_since_review} newer commit(s)`);
  }
  return parts.join(" · ");
}

function mineDetail(item) {
  const parts = [`reviews: ${item.reviewer_summary}`];
  if (item.rerequest.length) parts.push(`re-request ${item.rerequest.join(", ")}`);
  if (item.mergeable) parts.push(item.mergeable.toLowerCase());
  parts.push(`updated ${ago(item.updated_at)}`);
  return parts.join(" · ");
}

async function load(refresh) {
  const button = document.getElementById("refresh");
  button.disabled = true;
  try {
    const response = await fetch(`/api/prs${refresh ? "?refresh=1" : ""}`, { credentials: "same-origin" });
    if (response.status === 401) {
      document.getElementById("meta").textContent = "Session expired. Reopen the URL from `reviewbot token`.";
      return;
    }
    const data = await response.json();
    renderNotes(data.notifications, data.errors.notifications);
    render("queue", "queue-count", data.queue, data.errors.queue, queueDetail);
    render("mine", "mine-count", data.mine, data.errors.mine, mineDetail);
    const fetched = Math.min(...[data.queue_at, data.mine_at, data.notifications_at].filter(Boolean));
    const when = Number.isFinite(fetched) ? new Date(fetched * 1000).toLocaleTimeString() : "never";
    document.getElementById("meta").textContent = `${data.scope} · fetched ${when}`;
  } catch (error) {
    document.getElementById("meta").textContent = `Could not reach ReviewBot: ${error}`;
  } finally {
    button.disabled = false;
  }
}

document.getElementById("refresh").addEventListener("click", () => load(true));
load(false);
setInterval(() => load(false), POLL_MS);
</script>
</body>
</html>
